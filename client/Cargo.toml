[package]
name = "picam2_client"
version = "0.1.0"
edition = "2021"

[dependencies]
# opencv = { version = "0.92.0", default-features = false, features = ["imgcodecs", "videoio"] }
zenoh = "1.3.0"
rust-faces = { version = "1.0.0", features = ["viz"] }
ndarray = "0.16"
imageproc = "0.25.0"
image = "0.25.6"
turbojpeg = {version = "1.0", features = ["image"]}
tracing-subscriber = { version = "0.3", features = [ "env-filter", "fmt" ] }
ort = { version = "=2.0.0-rc.9", features = ["cuda", "fetch-models", "ndarray"] }
